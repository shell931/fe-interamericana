<div class="container">
    <div class="row mt-5 backgroundstyle">
        <div class="col-lg-3 col-sm-12 col-xs-12 pad_t">
            <div class="banner_tienda">
                <h3 class="titulo mb-5"><b> {{name_store}}</b></h3>
            </div>
            <mat-card class="mat_categories">
                <b>Buscar productos por categoria:</b>
                <mat-list role="list">
                    <mat-tree [dataSource]="dataSourceN" [treeControl]="treeControlN" class="example-tree">
                        <!-- This is the tree node template for leaf nodes -->
                        <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding class="nav-li" matTreeNodePaddingIndent="0">
                            <!-- use a disabled button to provide padding for tree leaf -->
                            <mat-list-item>
                                <a (click)="SearchStoreCategories(node.type,node.id_store,node.id)" class="link-category" style="    font-size: 13px;">
                                    {{node.name}}
                                </a>
                                <button mat-icon-button disabled></button>
                            </mat-list-item>
                        </mat-tree-node>
                        <!-- This is the tree node template for expandable nodes -->
                        <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding class="nav-li">
                            <mat-list-item>
                                <a (click)="SearchStoreCategories(node.type,node.id_store,node.id)" class="link-category">
                                    <!-- <img _ngcontent-embryo-seo-pre-c396="" src="assets/images/categories/mascota-amigable.svg" alt="image" class="image-li">{{node.name}} -->
                                    <img _ngcontent-embryo-seo-pre-c396="" src=" assets/images/icons_category_product/{{node.icon}}" alt="image" class="image-li">{{node.name}}
                                </a>
                                <!-- <mat-icon>home</mat-icon> {{node.name}} -->
                                <div class="mat-tree-node">
                                    <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'toggle ' + node.name">
                                        <mat-icon class="mat-icon-rtl-mirror icon_arrow_forward_ios">
                                            {{treeControlN.isExpanded(node) ? 'expand_less' : 'expand_more'}}
                                        </mat-icon>
                                    </button>
                                </div>

                            </mat-list-item>
                        </mat-tree-node>
                    </mat-tree>
                </mat-list>

            </mat-card>
        </div>

        <div class="col-lg-9 col-sm-12 col-xs-12 pad_t">

            <!-- <mat-toolbar class=""> -->
            <!-- <mat-form-field style="width: 100%" floatLabel='never'> -->
            <div class="buttonIn">
                <input class="inputsearch" matInput [(ngModel)]="searchText" placeholder="BUSCAR EN {{name_store}}" autocomplete="off" type="search">
                <button class="btn btn-primary button-search class_search" type="submit" tabindex="-1">
                    <span class="mat-button-wrapper">
                        <i class="fa fa-search"></i>
                    </span></button>
            </div>

            <!-- </mat-form-field> -->
            <!-- </mat-toolbar> -->
            <div fxLayout="row wrap" fxLayoutAlign="none" class="col-gap div_produc">


                <mat-card class="example-card card_store_prod" fxFlex="20%" fxFlex.xs="50%" fxFlex.sm="33%" *ngFor="let card of obs | async | filter : searchText | paginate: { itemsPerPage: 15, currentPage: p }  ">
                    <mat-card-content class="product-content producto_destacado relative">
                        <a class="p-link link_producto" *ngIf="!card?.id" [routerLink]="[card?.route_product]">
                            <!-- <img class="img_size" mat-card-image [defaultImage]="card?.image" [lazyLoad]="card?.image"> -->
                            <img class="img_size image_pixeled" width="626" height="800" mat-card-image [src]="card?.image" [ngClass]="{ transparent: !loaded }" (load)="onLoad()" alt="Photo">
                        </a>
                        <a class="p-link" *ngIf="card?.id" [routerLink]="['/products', card?.type, card?.id_product]">
                            <img class="img_size image_pixeled" mat-card-image [src]="card?.image" [defaultImage]="card?.image" [lazyLoad]="card?.image">
                        </a>
                        <div class="right-block">
                            <h6 class="titulo_producto"><a *ngIf="product?.id_product" [routerLink]="['/products', card?.type, card?.id_product]" class="title-link">{{card?.name}}</a> </h6>
                            <h6 class="titulo_producto"><a *ngIf="!product?.id_product" [routerLink]="['/products/accessories/card?.id_product']" class="title-link">{{card?.name}}</a> </h6>
                            <p class="price">
                                <span class="price-new">{{card?.price | currency : 'USD' : 'symbol' : '1.0-0'}}</span>
                            </p>
                            <p class="price red">
                                <span class="price-red">{{card?.price | currency : 'USD' : 'symbol' : '1.0-0'}} <img
                                        class="cards" src="assets/images/tarjetas.png" /> </span>
                            </p>
                            <div class="rating-star">
                                <embryo-Rating [rate]="card.rating"></embryo-Rating>
                            </div>
                            <button (click)="productAddToWishlist(card, i+'-wishlist')" type="button" class="wishlist btn-button" title="Añadir a lista de deseos"><i
                                    class="fa fa-heart-o"></i>
                            </button>
                            <div class="btn_comprar" *ngIf="checkCartAlready(card)">
                                <embryo-AddToCardButton [product]="product" (addToCart)="addToCartProduct($event)">
                                </embryo-AddToCardButton>
                                <ng-container *ngIf="card">
                                    <button mat-fab (click)="addToCartProduct(card)" class="btn-button"><i
                                            class="fa fa-cart-plus" aria-hidden="true"></i></button>
                                </ng-container>
                            </div>
                            <div class="btn_comprar" *ngIf="!checkCartAlready(card)">
                                <button class="btn-button" mat-fab *ngIf="card?.id_product" [routerLink]="['/products', card?.type, card?.id_product]"><i class="fa fa-eye"
                                        aria-hidden="true"></i> </button>
                                <button class="btn-button" mat-fab *ngIf="!card?.id_product" [routerLink]="[card?.route_product]"><i class="fa fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <span class="deliveryicon">
                                <img src="assets/images/shipping-fast-solid.svg" /> Envío gratis</span>
                            <bar-rating [(rate)]="rate" [max]="5"></bar-rating>
                        </div>
                    </mat-card-content>
                </mat-card>

            </div>
            <mat-paginator [pageSizeOptions]="[15, 15, 25, 100]"></mat-paginator>
        </div>

    </div>

</div>
