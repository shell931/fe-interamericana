<div class="store-page-container">
    <div class="store-layout">
        <!-- Sidebar -->
        <aside class="store-sidebar">
            <!-- Store Header (oculto en Interamericana: tienda única) -->
            
            <!-- Categories Filter -->
            <div class="categories-filter">
                <h3 class="filter-title">Categorías</h3>
                <mat-tree [dataSource]="dataSourceN" [treeControl]="treeControlN" class="category-tree">
                    <!-- Leaf nodes -->
                    <mat-tree-node *matTreeNodeDef="let node" class="category-item"
                        [class.category-item--child]="node.level > 0">
                        <a (click)="SearchStoreCategories(node.type,node.id_store,node.id)" class="category-link">
                            <span class="category-text" [class.category-text--parent]="node.level === 0">{{node.name}}</span>
                        </a>
                    </mat-tree-node>

                    <!-- Expandable nodes -->
                    <mat-tree-node *matTreeNodeDef="let node;when: hasChild" class="category-item category-item--parent">
                        <a (click)="SearchStoreCategories(node.type,node.id_store,node.id)" class="category-link">
                            <span class="category-text category-text--parent">{{node.name}}</span>
                        </a>
                    </mat-tree-node>
                </mat-tree>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="store-main">
            <br>
            <!-- Search Bar -->
            <div class="search-section">
                <div class="search-container">
                    <form class="search-form" (ngSubmit)="applyFilter()">
                        <input 
                            class="search-input" 
                            matInput 
                            [(ngModel)]="searchText" 
                            (ngModelChange)="applyFilter()"
                            (input)="applyFilter()"
                            (keyup.enter)="applyFilter()"
                            [placeholder]="'Buscar en ' + name_store" 
                            autocomplete="off" 
                            type="search"
                            name="searchInput">
                    </form>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-section">
                <div class="products-grid">
                    <!-- Misma card que la home (estilos en assets/scss/pages/_ia-product-card.scss) -->
                    <article class="ia-product-card" *ngFor="let card of obs | async; let i = index">
                        <div class="ia-product-card__media">
                            <a *ngIf="card?.route_product && card?.id_product" [routerLink]="card?.route_product">
                                <img class="ia-product-card__img" [src]="card?.image" [alt]="card?.name" loading="lazy">
                            </a>
                            <img *ngIf="!card?.route_product || !card?.id_product" class="ia-product-card__img" [src]="card?.image" [alt]="card?.name" loading="lazy">
                            <button type="button" class="ia-product-card__action ia-product-card__action--wishlist" [class.is-active]="checkWishlistAlready(card)" (click)="productAddToWishlist(card, i+'-wishlist')" title="Añadir a lista de deseos">
                                <i [class]="checkWishlistAlready(card) ? 'fa fa-heart' : 'fa fa-heart-o'" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="ia-product-card__action ia-product-card__action--cart" *ngIf="checkCartAlready(card)" (click)="addToCartProduct(card)" title="Añadir al carrito">
                                <i class="fa fa-cart-plus" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="ia-product-card__action ia-product-card__action--cart" *ngIf="!checkCartAlready(card) && card?.route_product && card?.id_product" [routerLink]="card?.route_product" title="Ver producto">
                                <i class="fa fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="ia-product-card__body">
                            <h6 class="ia-product-card__title">
                                <a *ngIf="card?.route_product && card?.id_product" [routerLink]="card?.route_product">{{ card?.name }}</a>
                                <span *ngIf="!card?.route_product || !card?.id_product">{{ card?.name }}</span>
                            </h6>
                            <p class="ia-product-card__price">{{ card?.price | currency : 'USD' : 'symbol' : '1.0-0' }}</p>
                        </div>
                    </article>
                </div>
                
                <!-- Paginator -->
                <mat-paginator [pageSizeOptions]="[15, 25, 50, 100]"></mat-paginator>
            </div>
        </main>
    </div>
</div>
