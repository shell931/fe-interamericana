<div class="main-container">

    <!-- Carrusel a ancho completo fuera del container -->
    <swiper-container
        class="slider_home"
        loop="true"
        autoplay="true"
        autoplay-delay="3000"
        pagination="true"
        pagination-clickable="true"
        navigation="true"
        slides-per-view="1"
        space-between="0"
        effect="slide"
        speed="600"
        auto-height="true"
    >
        <swiper-slide>
            <img src="assets/kompralostyle/image/catalog/slideshow/home3/sliderbanner.jpg"
                 alt="Repuestos de carro y autopartes - Interamericana" loading="lazy" />
        </swiper-slide>
        <swiper-slide>
            <img src="assets/kompralostyle/image/catalog/slideshow/home3/sliderbanner2.jpg"
                 alt="Escobillas de grafito, rodamientos y farolas para carros" loading="lazy" />
        </swiper-slide>
    </swiper-container>

    <div class="container container-wide">

        <!-- Header principal con SEO -->
        <header class="page-header visually-hidden">
            <h1 class="page-title">{{ getPageTitle() }}</h1>
            <p class="page-description">{{ getPageDescription() }}</p>
        </header>

        <div class="box-content1">

        </div>

        <!-- Contenedor de servicios eliminado y reemplazado por diálogo promocional -->


        <!-- Main Layout with Sidebar -->
        <div class="destacados-grid sin-sidebar">
            <!-- Main Content Area -->
            <section class="products-area" aria-label="Productos destacados">
                <h2 class="section-title">{{ getSectionTitle() }}</h2>
                <p class="section-description">{{ getSectionDescription() }}</p>

                <!-- Interamericana: acceso directo al catálogo completo -->
                <div class="ver-mas-productos-section" style="text-align: center; margin: 0 0 20px;">
                    <button class="btn btn-block transparent-btn" (click)="extendGridStructure()">
                        VER TODOS LOS PRODUCTOS
                    </button>
                </div>
                
                <!-- Featured Products Grid -->
                <div class="products-grid" fxLayout="row wrap">
                    <!-- Interamericana: card propia (clases ia-product-card), estilo del sitio original -->
                    <article class="ia-product-card" *ngFor="let card of productsGrid; let i = index">
                        <div class="ia-product-card__media">
                            <a *ngIf="!card?.id" [routerLink]="[card?.route_product]">
                                <img class="ia-product-card__img" [defaultImage]="card?.image" [lazyLoad]="card?.image" [alt]="getProductImageAlt(card)" (error)="onImageError($event)">
                            </a>
                            <a *ngIf="card?.id" [routerLink]="['/products', card?.type, card?.id_product]">
                                <img class="ia-product-card__img" [src]="card?.image" [defaultImage]="card?.image" [lazyLoad]="card?.image" [alt]="getProductImageAlt(card)" (error)="onImageError($event)">
                            </a>
                            <button type="button" class="ia-product-card__action ia-product-card__action--wishlist" [class.is-active]="checkWishlistAlready(card)" [id]="i+'-wishlist'" (click)="productAddToWishlist(card, i+'-wishlist')" title="Añadir a lista de deseos">
                                <i [class]="checkWishlistAlready(card) ? 'fa fa-heart' : 'fa fa-heart-o'" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="ia-product-card__action ia-product-card__action--cart" *ngIf="checkCartAlready(card)" (click)="addToCartProduct(card)" title="Añadir al carrito">
                                <i class="fa fa-cart-plus" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="ia-product-card__action ia-product-card__action--cart" *ngIf="!checkCartAlready(card) && card?.id_product" [routerLink]="['/products', card?.type, card?.id_product]" title="Ver producto">
                                <i class="fa fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="ia-product-card__body">
                            <h6 class="ia-product-card__title">
                                <a *ngIf="card?.id_product" [routerLink]="['/products', card?.type, card?.id_product]">{{ card?.name }}</a>
                                <a *ngIf="!card?.id_product" [routerLink]="[card?.route_product]">{{ card?.name }}</a>
                            </h6>
                            <p class="ia-product-card__price">{{ card?.price | currency : 'USD' : 'symbol' : '1.0-0' }}</p>
                            <span class="ia-product-card__shipping"><img src="assets/images/shipping-fast-solid.svg" alt="" /> Envío a todo el país</span>
                        </div>
                    </article>
                </div>
                
                <!-- VER TODOS LOS PRODUCTOS BUTTON -->
                <div class="ver-mas-productos-section" style="text-align: center; margin: 30px 0;">
                    <button class="btn btn-block transparent-btn" (click)="extendGridStructure()">
                        VER TODOS LOS PRODUCTOS
                    </button>
                </div>
            </section>
        </div>

    </div>
</div>
