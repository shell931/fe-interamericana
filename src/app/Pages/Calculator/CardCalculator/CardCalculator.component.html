<mat-card class="p-0 mat-card-calculator">
  <mat-card-header class="card-header px-2 py-2 border-0">
    <mat-card-title class="mb-0 font-bold">{{title}}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="card-content px-2 pt-2 pb-1 m-0">
    <div class="pb-1" *ngFor="let item of items">
      <div class="row">
        <div class="col-9">
          {{item.text}}
        </div>
        <div class="col-3 text-right">
          {{item.value | currency : 'USD' : 'symbol' : '1.0-0'}}
        </div>
      </div>
    </div>
  </mat-card-content>
  <mat-card-footer class="card-footer m-0 px-2 py-2 border-0">
    <div class="row">
      <div class="col-9 font-bold">
        {{footer?.text}}
      </div>
      <div class="col-3 text-right">
        {{footer?.value | currency : 'USD' : 'symbol' : '1.0-0'}}
      </div>
    </div>
  </mat-card-footer>
</mat-card>
