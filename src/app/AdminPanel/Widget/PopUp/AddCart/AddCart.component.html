<div class="bg-white final-receipt-page">
    <mat-card class="pt-0 w-100 m-0">
        <!-- Header del card con el título -->
        <div class="card-header">
            <h5 class="color_title title-add-to-card mb-0">Agregaste en tu carrito:</h5>
        </div>

        <!-- Contenido del card -->
        <div class="py-3 px-3">
            <div class="d-flex flex-column align-items-center justify-content-center">
                <div class="product-image-container mb-3">
                    <img [src]="data.image" [alt]="data.name" class="product-image">
                </div>
                <div class="product-info-container text-center">
                    <p class="mb-2"><b class="add-to-card">{{data.name}}</b></p>
                    <p class="mb-4"><b class="add-to-card">{{data.price | currency : 'USD' : 'symbol' : '1.0-0'}}</b></p>
                    <div class="button-view-cart">
                        <button mat-raised-button color="accent" class="w-100" (click)="onClose()">
                            Ver carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </mat-card>
</div>
